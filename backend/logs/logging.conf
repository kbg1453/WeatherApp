[loggers]
keys=root

[handlers]
keys=consoleHandler,appFileHandler,bugFileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,appFileHandler,bugFileHandler

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
args=(sys.stdout,)

[handler_appFileHandler]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('app.log', 'a')

[handler_bugFileHandler]
class=FileHandler
level=WARNING
formatter=simpleFormatter
args=('bug.log', 'a')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S